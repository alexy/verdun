[package]
name = "verdun-cli"
version = "0.1.0"
edition = "2024"
description = "Mothership CLI and shared authenticated-client primitives for Verdun apps"
license = "MIT"
readme = "README.md"
repository = "https://github.com/alexy/verdun"
keywords = ["verdun", "cli", "workbench", "crawler"]
categories = ["command-line-utilities"]

[[bin]]
name = "verdun"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.5.53", features = ["derive"] }
dirs = "6.0"
reqwest = { version = "0.12.24", features = ["blocking", "json", "rustls-tls"], default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
toml = "0.9.8"
